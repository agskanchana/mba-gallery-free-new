name: CI

# Every push and pull request: the release checks (versions agree, changelog
# entry, release-build contents), PHP syntax on every PHP version the plugin
# supports, and JavaScript syntax. deploy.yml runs this same workflow first and
# deploys nothing unless it passes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash bin/check-release.sh

  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "Requires PHP: 7.4" — keep the oldest supported version in this list.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $status

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: node --check on the plugin's own scripts
        run: find assets/js admin/js -name '*.js' -print0 | xargs -0 -n1 node --check
